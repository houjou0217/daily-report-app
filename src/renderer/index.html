<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>日報生成アプリ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <header class="app-header">
        <p class="eyebrow">OFFLINE DESKTOP APP</p>
        <h1 id="app-title">日報作成</h1>
        <p class="description">作業ブロックを入力すると、ローカルへ自動保存します。</p>
      </header>

      <section class="report-panel" aria-labelledby="report-title">
        <div class="report-toolbar">
          <div>
            <h2 id="report-title">対象日</h2>
            <label class="date-field" for="report-date">
              <span class="visually-hidden">対象日</span>
              <input id="report-date" type="date" />
            </label>
          </div>
          <p class="save-status" id="app-status" role="status">読み込み中…</p>
        </div>

        <p class="project-notice" id="project-notice" hidden>
          作業ブロックを追加するには、先に案件管理画面で案件を登録してください。
        </p>

        <div class="block-list" id="block-list" aria-live="polite"></div>
        <p class="empty-state" id="empty-state" hidden>この日の作業ブロックはまだありません。</p>
        <button class="add-block-button" id="add-block" type="button" disabled>＋ 作業ブロックを追加</button>

        <label class="comment-field">
          <span>本日の所感・共有事項</span>
          <textarea id="report-comment" rows="3" maxlength="2000" placeholder="任意で入力"></textarea>
        </label>
        <button class="preview-button" id="show-preview" type="button">プレビューを表示 →</button>
      </section>

      <section class="preview-panel" id="preview-panel" aria-labelledby="preview-title" hidden>
        <div class="preview-heading">
          <div>
            <p class="eyebrow">REPORT PREVIEW</p>
            <h2 id="preview-title">日報プレビュー</h2>
          </div>
          <div class="preview-actions">
            <button class="copy-button" id="copy-report" type="button">クリップボードにコピー</button>
            <button class="secondary-button" id="return-to-input" type="button">＜ 入力に戻る</button>
          </div>
        </div>
        <pre class="preview-text" id="preview-text" tabindex="0"></pre>
        <p class="copy-feedback" id="copy-feedback" role="status" hidden></p>
      </section>
    </main>
  </body>
</html>
